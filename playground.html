<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eventum Playground</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="icon" type="image/png" href="favicon.png"/>
</head>
<body class="playground">
  <header>
    <a href="index.html"><img src="logo.svg" class="logo small" alt="Logo"/></a>
    <h1>Encryption Playground</h1>
    <p>Try live post-quantum encryption below:</p>
  </header>

  <main>
    <textarea id="message" placeholder="Enter your message..."></textarea>
    <button class="btn neon" onclick="encryptMessage()">Encrypt</button>
    <div id="output-box" class="output-box"></div>
  </main>

  <div class="bank-mode-toggle">
    <label>
      <input type="checkbox" id="bankModeToggle" onchange="toggleBankMode()" />
      Bank Mode
    </label>
  </div>

  <footer>
    <p>Encryption powered by Eventum Shield.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
